services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: trackup-backend-prod:latest
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      SYMFONY_TRUSTED_PROXIES: ${SYMFONY_TRUSTED_PROXIES:-private_ranges}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      RISEUP_API_BASE_URL: ${RISEUP_API_BASE_URL}
      RISEUP_API_PUBLIC_KEY: ${RISEUP_API_PUBLIC_KEY}
      RISEUP_API_PRIVATE_KEY: ${RISEUP_API_PRIVATE_KEY}
      MAILER_DSN: smtp://mailer:1025
      MAILER_FROM_ADDRESS: ${MAILER_FROM_ADDRESS}
      FRONTEND_URL: ${FRONTEND_URL}
      ABSENCES_DISCIPLINARY_ALERT_EMAIL: ${ABSENCES_DISCIPLINARY_ALERT_EMAIL}
    volumes:
      - jwt_keys:/app/config/jwt
      - absence_uploads:/app/var/uploads/absences
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailer:
        condition: service_started
    expose:
      - "9000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SCRIPT_NAME=/index.php SCRIPT_FILENAME=/app/public/index.php REQUEST_METHOD=GET
          REQUEST_URI=/api/health SERVER_PROTOCOL=HTTP/1.1 SERVER_NAME=localhost SERVER_PORT=80
          cgi-fcgi -bind -connect 127.0.0.1:9000 |
          php -r 'exit(str_contains(stream_get_contents(STDIN), "\"status\":\"ok\"") ? 0 : 1);'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal

  worker:
    # Pas de `build:` ici, volontairement : `worker` réutilise l'image construite par le service
    # `backend` juste au-dessus (même `image:`, même Dockerfile.prod). Avant, les deux déclaraient
    # chacun leur propre `build:` — Compose recompilait donc deux fois la partie la plus lente du
    # build (compilation des extensions PHP dont `pecl install redis`, `composer install`...) à
    # chaque déploiement, pour un résultat strictement identique. `docker compose build` ne build
    # que les services qui ont un `build:` ; `worker` récupère simplement l'image déjà taguée par
    # celui de `backend`, construite juste avant lui dans la même passe de déploiement.
    image: trackup-backend-prod:latest
    pull_policy: never
    restart: unless-stopped
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M -vv
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      RISEUP_API_BASE_URL: ${RISEUP_API_BASE_URL}
      RISEUP_API_PUBLIC_KEY: ${RISEUP_API_PUBLIC_KEY}
      RISEUP_API_PRIVATE_KEY: ${RISEUP_API_PRIVATE_KEY}
      MAILER_DSN: smtp://mailer:1025
      MAILER_FROM_ADDRESS: ${MAILER_FROM_ADDRESS}
      FRONTEND_URL: ${FRONTEND_URL}
      ABSENCES_DISCIPLINARY_ALERT_EMAIL: ${ABSENCES_DISCIPLINARY_ALERT_EMAIL}
    volumes:
      - jwt_keys:/app/config/jwt
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailer:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "bin/console", "app:health:worker", "--no-interaction"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal

  # Sans ce service, les 3 crons de Schedule.php (sync Rise Up 2h00, détection d'absences 3h00,
  # expiration des justificatifs 4h00) sont bien enregistrés mais ne se déclenchent JAMAIS : ils
  # passent par un transport dédié (scheduler_default) qui a besoin d'un processus séparé qui le
  # consomme en continu, exactement comme `worker` pour le transport `async`. Même image partagée
  # que `backend`/`worker`, juste une commande différente.
  scheduler:
    image: trackup-backend-prod:latest
    pull_policy: never
    restart: unless-stopped
    command: php bin/console messenger:consume scheduler_default --time-limit=3600 --memory-limit=256M -vv
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      RISEUP_API_BASE_URL: ${RISEUP_API_BASE_URL}
      RISEUP_API_PUBLIC_KEY: ${RISEUP_API_PUBLIC_KEY}
      RISEUP_API_PRIVATE_KEY: ${RISEUP_API_PRIVATE_KEY}
      MAILER_DSN: smtp://mailer:1025
      MAILER_FROM_ADDRESS: ${MAILER_FROM_ADDRESS}
      FRONTEND_URL: ${FRONTEND_URL}
      ABSENCES_DISCIPLINARY_ALERT_EMAIL: ${ABSENCES_DISCIPLINARY_ALERT_EMAIL}
    volumes:
      - jwt_keys:/app/config/jwt
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailer:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "bin/console", "app:health:worker", "--no-interaction"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1/health | grep -q healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - coolify
      - internal
    labels:
      - traefik.docker.network=coolify

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: trackup
      MYSQL_USER: trackup
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Système de mail "pour le moment" : Mailpit capture tous les emails envoyés par l'app (reset de
  # mot de passe, notifications d'absence, alertes disciplinaires, résumés de sync...) sans jamais
  # les délivrer réellement à un vrai destinataire — même logique qu'en dev (voir docker-compose.yml).
  # Le port 1025 (SMTP factice) reste interne, seul le port 8025 (interface web de consultation) est
  # exposé via Traefik/Coolify, comme phpmyadmin ci-dessous. À remplacer par un vrai fournisseur SMTP
  # (MAILER_DSN) quand l'app sera prête à envoyer de vrais emails.
  mailer:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      # Sans base sur volume, Mailpit garde les mails en mémoire : chaque redéploiement vide la boîte.
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
      # L'interface est publique (reset de mot de passe, liens de justificatif...) : accès protégé.
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:?Définir MAILPIT_UI_AUTH (utilisateur:motdepasse) dans Coolify}
    volumes:
      - mailpit_data:/data
    expose:
      - "8025"
    networks:
      - coolify
      - internal
    labels:
      - traefik.docker.network=coolify

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    expose:
      - "80"
    networks:
      - coolify
      - internal
    labels:
      - traefik.docker.network=coolify

volumes:
  mysql_data:
    driver: local
  mailpit_data:
    driver: local
  redis_data:
    driver: local
  jwt_keys:
    driver: local
  absence_uploads:
    driver: local

networks:
  internal:
    driver: bridge
  coolify:
    external: true
    name: coolify
