services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      RISEUP_API_BASE_URL: ${RISEUP_API_BASE_URL}
      RISEUP_API_PUBLIC_KEY: ${RISEUP_API_PUBLIC_KEY}
      RISEUP_API_PRIVATE_KEY: ${RISEUP_API_PRIVATE_KEY}
      MAILER_DSN: smtp://mailer:1025
      MAILER_FROM_ADDRESS: ${MAILER_FROM_ADDRESS}
      FRONTEND_URL: ${FRONTEND_URL}
      ABSENCES_DISCIPLINARY_ALERT_EMAIL: ${ABSENCES_DISCIPLINARY_ALERT_EMAIL}
    volumes:
      - jwt_keys:/app/config/jwt
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      mailer:
        condition: service_started
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit((int)(@file_get_contents('http://127.0.0.1:8000/api/health') === false));",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M -vv
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      RISEUP_API_BASE_URL: ${RISEUP_API_BASE_URL}
      RISEUP_API_PUBLIC_KEY: ${RISEUP_API_PUBLIC_KEY}
      RISEUP_API_PRIVATE_KEY: ${RISEUP_API_PRIVATE_KEY}
      MAILER_DSN: smtp://mailer:1025
      MAILER_FROM_ADDRESS: ${MAILER_FROM_ADDRESS}
      FRONTEND_URL: ${FRONTEND_URL}
      ABSENCES_DISCIPLINARY_ALERT_EMAIL: ${ABSENCES_DISCIPLINARY_ALERT_EMAIL}
    volumes:
      - jwt_keys:/app/config/jwt
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      mailer:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1/health | grep -q healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - coolify
      - internal
    labels:
      - traefik.docker.network=coolify

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: trackup
      MYSQL_USER: trackup
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Système de mail "pour le moment" : Mailpit capture tous les emails envoyés par l'app (reset de
  # mot de passe, notifications d'absence, alertes disciplinaires, résumés de sync...) sans jamais
  # les délivrer réellement à un vrai destinataire — même logique qu'en dev (voir docker-compose.yml).
  # Le port 1025 (SMTP factice) reste interne, seul le port 8025 (interface web de consultation) est
  # exposé via Traefik/Coolify, comme phpmyadmin ci-dessous. À remplacer par un vrai fournisseur SMTP
  # (MAILER_DSN) quand l'app sera prête à envoyer de vrais emails.
  mailer:
    image: axllent/mailpit:latest
    restart: unless-stopped
    expose:
      - "8025"
    networks:
      - coolify
      - internal
    labels:
      - traefik.docker.network=coolify

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    expose:
      - "80"
    networks:
      - coolify
      - internal
    labels:
      - traefik.docker.network=coolify

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  jwt_keys:
    driver: local

networks:
  internal:
    driver: bridge
  coolify:
    external: true
    name: coolify
