nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        # '^/' matches every path, and a null override here means "apply
        # `defaults` above unmodified" (not "disable CORS"). Confirmed live:
        # `curl -X OPTIONS /api/health -H "Origin: ..."` returns the expected
        # Access-Control-Allow-Origin/-Methods/-Headers. Keep this comment so
        # the next person doesn't need to re-verify from scratch.
        '^/': null
